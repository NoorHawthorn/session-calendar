<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitleTag">Session Run-Up Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22262B;
    --paper:#F5F1E6;
    --paper-2:#EDE7D8;
    --navy:#1B2A38;
    --navy-2:#243A4D;
    --gold:#B8862E;
    --gold-soft:#E4C77E;
    --sky:#4A7C9E;
    --rule:#C9C2B0;
    --danger:#9C4634;
    --ok:#3F6B4A;
    --shadow: 0 1px 2px rgba(27,42,56,0.06), 0 4px 14px rgba(27,42,56,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px 80px;}

  header.top{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:var(--paper);
    padding:36px 24px 28px;
    border-bottom:4px solid var(--gold);
  }
  header.top .inner{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold-soft);
    margin:0 0 8px;
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    line-height:1.1;
  }
  .sub{font-size:14px;color:#C9D3DA;max-width:520px;line-height:1.5;}
  .cornerstone{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    border-left:1px solid rgba(228,199,126,0.35);
    padding-left:20px;
  }
  .cornerstone .n{font-size:40px;font-weight:600;color:var(--gold-soft);line-height:1;}
  .cornerstone .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FB0BB;margin-top:6px;}

  .toolbar{
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
    margin:28px 0 18px;
  }
  .viewtoggle{display:flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden;}
  .viewtoggle button{
    font-family:'Inter';font-size:13px;font-weight:600;
    background:transparent;border:none;color:var(--navy);
    padding:9px 16px;cursor:pointer;
  }
  .viewtoggle button.active{background:var(--navy);color:var(--paper);}
  .btn{
    font-family:'Inter';font-weight:600;font-size:13px;
    background:var(--gold);color:var(--navy);border:none;border-radius:8px;
    padding:10px 18px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);box-shadow:none;}
  .btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.55;cursor:default;transform:none;}

  .status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7A7364;}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:4px 9px;border-radius:20px;background:var(--paper-2);border:1px solid var(--rule);
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}

  .month-group{margin-bottom:6px;}
  .month-head{
    font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;
    padding:18px 0 8px;border-bottom:2px solid var(--navy);margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .month-head .cnt{font-family:'IBM Plex Mono';font-size:11px;color:#8A8371;font-weight:400;}

  .event-row{
    display:grid;grid-template-columns:86px 5px 1fr auto;gap:14px;align-items:start;
    padding:14px 6px;border-bottom:1px solid var(--rule);background:transparent;
    transition:background .12s ease;
  }
  .event-row:hover{background:rgba(184,134,46,0.06);}
  .date-block{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy);line-height:1.4;padding-top:2px;}
  .date-block .dow{color:#8A8371;font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
  .date-block .dnum{font-size:18px;font-weight:600;}
  .cat-bar{align-self:stretch;border-radius:3px;min-height:100%;}
  .ev-title{font-weight:600;font-size:15px;margin:0 0 3px;}
  .ev-desc{font-size:13px;color:#4B463C;line-height:1.5;margin:0 0 6px;}
  .ev-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tag{font-family:'IBM Plex Mono';font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:10px;}
  .status-tag{font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);}
  .src-link{font-size:11px;color:var(--sky);text-decoration:none;}
  .src-link:hover{text-decoration:underline;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    border:none;background:transparent;cursor:pointer;color:#8A8371;font-size:14px;
    padding:4px 6px;border-radius:5px;
  }
  .icon-btn:hover{background:var(--paper-2);color:var(--ink);}

  .cal-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin:8px 0 16px;}
  .cal-nav h2{font-family:'Source Serif 4',serif;font-size:22px;margin:0;min-width:220px;text-align:center;}
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule);
    border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  }
  .cal-dow{background:var(--navy);color:var(--paper);text-align:center;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;}
  .cal-cell{background:var(--paper);min-height:96px;padding:6px;position:relative;}
  .cal-cell:not(.out){cursor:pointer;transition:background .12s ease;}
  .cal-cell:not(.out):hover{background:rgba(184,134,46,0.08);}
  .cal-cell.out{background:#EEEAE0;}
  .cal-cell .dnum{font-family:'IBM Plex Mono';font-size:11px;color:#8A8371;}
  .cal-cell.today .dnum{color:var(--gold);font-weight:700;}
  .cal-ev{
    font-size:10.5px;padding:2px 5px;border-radius:4px;margin-top:3px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;
  }

  .overlay{position:fixed;inset:0;background:rgba(27,42,56,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--paper);border-radius:12px;max-width:480px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto;}
  .modal h3{font-family:'Source Serif 4',serif;margin:0 0 16px;font-size:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-family:'IBM Plex Mono';text-transform:uppercase;letter-spacing:.05em;color:#7A7364;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;
    font-family:'Inter';font-size:13px;background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .modal-error{font-size:12px;color:var(--danger);margin:-6px 0 12px;display:none;}

  .empty{text-align:center;padding:60px 20px;color:#8A8371;}
  footer{text-align:center;padding:30px 0 10px;font-size:11px;color:#9a9484;font-family:'IBM Plex Mono';}

  @media (max-width:600px){
    header.top .inner{flex-direction:column;align-items:flex-start;}
    .cornerstone{text-align:left;border-left:none;padding-left:0;}
    .event-row{grid-template-columns:60px 4px 1fr;}
    .row-actions{grid-column:1/-1;justify-content:flex-end;}
    .cal-grid{font-size:10px;}
    .cal-cell{min-height:70px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div>
      <p class="eyebrow" id="eyebrowText">&nbsp;</p>
      <h1 id="headingText">&nbsp;</h1>
      <p class="sub" id="subText">&nbsp;</p>
    </div>
    <div class="cornerstone">
      <div class="n" id="countdown">—</div>
      <div class="l" id="countdownLabel"></div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="toolbar">
    <div class="viewtoggle">
      <button id="btnList" class="active">List</button>
      <button id="btnCal">Calendar</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="status" id="statusMsg">loading…</span>
      <button class="btn ghost" id="btnExport">⬇ Download .ics</button>
      <button class="btn" id="btnAdd">+ Add event</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div id="listView"></div>
  <div id="calView" style="display:none;"></div>

  <div class="empty" id="emptyState" style="display:none;">No events yet. Click "Add event" to start building the calendar.</div>

</div>

<footer id="footerText"></footer>

<div class="overlay" id="overlay" style="display:none;">
  <div class="modal">
    <h3 id="modalTitle">Add event</h3>
    <input type="hidden" id="editId">
    <p class="modal-error" id="modalError"></p>
    <div class="field">
      <label>Event name</label>
      <input type="text" id="fName" placeholder="e.g. Bill Draft Request deadline">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>End date (optional)</label>
        <input type="date" id="fEndDate">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Category</label>
        <select id="fCategory"></select>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fStatus">
          <option>Confirmed</option>
          <option>Estimated</option>
          <option>TBD</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Description / why it matters</label>
      <textarea id="fDesc" placeholder="Optional context for this event"></textarea>
    </div>
    <div class="field">
      <label>Source link (optional)</label>
      <input type="text" id="fSrc" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="btnDelete" style="display:none;color:var(--danger);border-color:var(--danger);">Delete</button>
      <div style="display:flex;gap:10px;margin-left:auto;">
        <button class="btn ghost" id="btnCancel">Cancel</button>
        <button class="btn" id="btnSave">Save</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
